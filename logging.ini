[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=file

[formatters]
keys=standard,access

[logger_root]
level=INFO
handlers=file

[logger_uvicorn]
level=INFO
handlers=file
propagate=0
qualname=uvicorn

[logger_uvicorn.error]
level=INFO
handlers=file
propagate=0
qualname=uvicorn.error

[logger_uvicorn.access]
level=INFO
handlers=file
propagate=0
qualname=uvicorn.access

[handler_file]
class=logging.FileHandler
level=INFO
formatter=standard
args=('fast-fast-whisper.log', 'a', 'utf-8')

[formatter_standard]
format=%(levelprefix)s %(asctime)s %(message)s
class=uvicorn.logging.DefaultFormatter

[formatter_access]
format=%(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s
class=uvicorn.logging.AccessFormatter
