[pytest]
minversion = 6.0
pythonpath = 
    src
testpaths = 
    src/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .hg .svn __pycache__ .pytest_cache venv env .venv
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    src/tests/
